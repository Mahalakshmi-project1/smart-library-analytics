<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Student - Smart Library</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('dashboard') }}">
            📚 Smart Library
        </a>

        <a href="{{ url_for('logout') }}" class="btn btn-outline-light">
            Logout
        </a>
    </div>
</nav>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card shadow">

                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">➕ Add Student</h4>
                </div>

                <div class="card-body">

                    <!-- Flash Messages -->
                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}
                            {% for category, message in messages %}
                                <div class="alert alert-{{ category }}">
                                    {{ message }}
                                </div>
                            {% endfor %}
                        {% endif %}
                    {% endwith %}

                    <form method="POST"
                          action="{{ url_for('addstudent') }}">

                        <!-- Name -->
                        <div class="mb-3">
                            <label class="form-label">
                                Student Name
                            </label>

                            <input
                                type="text"
                                name="name"
                                class="form-control"
                                placeholder="Enter student name"
                                value="{{ name|default('') }}"
                                required
                            >
                        </div>

                        <!-- Department -->
                        <div class="mb-3">
                            <label class="form-label">
                                Department
                            </label>

                            <input
                                type="text"
                                name="department"
                                class="form-control"
                                placeholder="Example: ECE"
                                value="{{ department|default('') }}"
                                required
                            >
                        </div>

                        <!-- Year -->
                        <div class="mb-3">
                            <label class="form-label">
                                Year
                            </label>

                            <select
                                name="year"
                                class="form-select"
                                required
                            >
                                <option value="">Select Year</option>

                                <option value="1"
                                    {% if year|default('') == '1' %}selected{% endif %}>
                                    1st Year
                                </option>

                                <option value="2"
                                    {% if year|default('') == '2' %}selected{% endif %}>
                                    2nd Year
                                </option>

                                <option value="3"
                                    {% if year|default('') == '3' %}selected{% endif %}>
                                    3rd Year
                                </option>

                                <option value="4"
                                    {% if year|default('') == '4' %}selected{% endif %}>
                                    4th Year
                                </option>
                            </select>
                        </div>

                        <!-- Email -->
                        <div class="mb-3">
                            <label class="form-label">
                                Email
                            </label>

                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                placeholder="student@example.com"
                                value="{{ email|default('') }}"
                                required
                            >
                        </div>

                        <!-- Phone -->
                        <div class="mb-4">
                            <label class="form-label">
                                Phone Number
                            </label>

                            <input
                                type="tel"
                                name="phone"
                                class="form-control"
                                placeholder="10 digit phone number"
                                maxlength="10"
                                value="{{ phone|default('') }}"
                                required
                            >
                        </div>

                        <div class="d-flex justify-content-between">

                            <a
                                href="{{ url_for('dashboard') }}"
                                class="btn btn-secondary"
                            >
                                ← Back
                            </a>

                            <button
                                type="submit"
                                class="btn btn-primary"
                            >
                                Add Student
                            </button>

                        </div>

                    </form>

                </div>
            </div>

        </div>

    </div>

</div>

</body>
</html>
