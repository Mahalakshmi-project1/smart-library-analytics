<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Return Book - Smart Library</title>
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
    {% include 'navbar.html' %}
    <div class="container mt-4 col-md-8">
        <h2>Return Book</h2>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            <div>
                {% for category, message in messages %}
                    <div class="alert alert-{{category}} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            </div>
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('returnbook') }}">
            <div class="mb-3">
                <label for="issue_id" class="form-label">Select Issued Book</label>
                <select class="form-select" id="issue_id" name="issue_id" required>
                    <option value="">-- Select Issued Book --</option>
                    {% for ib in issued_books %}
                        <option value="{{ ib.issue_id }}">
                            {{ ib.title }} issued to {{ ib.student_name }} on {{ ib.issue_date }} (Due: {{ ib.due_date }})
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label for="return_date" class="form-label">Return Date</label>
                <input type="date" class="form-control" id="return_date" name="return_date" required value="{{ (datetime.utcnow().strftime('%Y-%m-%d')) }}">
            </div>

            <button type="submit" class="btn btn-primary">Return Book</button>
            <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Back to Dashboard</a>
        </form>
    </div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
