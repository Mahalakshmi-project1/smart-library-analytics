<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Smart Library</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            font-family: Arial, sans-serif;
        }

        .register-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
        }

        .register-card {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        .logo {
            width: 65px;
            height: 65px;
            margin: auto;
            border-radius: 50%;
            background: #0d6efd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }

        .title {
            font-weight: 700;
            color: #0f172a;
        }

        .subtitle {
            color: #6c757d;
        }

        .form-control {
            padding: 12px;
            border-radius: 10px;
        }

        .form-control:focus {
            box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.15);
        }

        .btn-register {
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
        }

        .back-link {
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="register-wrapper">

    <div class="register-card">

        <!-- Logo -->
        <div class="text-center mb-3">
            <div class="logo">
                📚
            </div>
        </div>

        <!-- Heading -->
        <div class="text-center mb-4">
            <h2 class="title">Create Account</h2>

            <p class="subtitle mb-0">
                Join the Smart Library Management System
            </p>
        </div>


        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}

            {% if messages %}

                {% for category, message in messages %}

                    <div
                        class="alert alert-{{ category }} alert-dismissible fade show"
                        role="alert"
                    >
                        {{ message }}

                        <button
                            type="button"
                            class="btn-close"
                            data-bs-dismiss="alert"
                        ></button>
                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}


        <!-- Register Form -->
        <form
            method="POST"
            action="{{ url_for('register') }}"
        >

            <!-- Name -->
            <div class="mb-3">

                <label
                    for="name"
                    class="form-label fw-semibold"
                >
                    Full Name
                </label>

                <input
                    type="text"
                    class="form-control"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    value="{{ name|default('') }}"
                    required
                    autocomplete="name"
                >

            </div>


            <!-- Email -->
            <div class="mb-3">

                <label
                    for="email"
                    class="form-label fw-semibold"
                >
                    Email Address
                </label>

                <input
                    type="email"
                    class="form-control"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    value="{{ email|default('') }}"
                    required
                    autocomplete="email"
                >

            </div>


            <!-- Password -->
            <div class="mb-3">

                <label
                    for="password"
                    class="form-label fw-semibold"
                >
                    Password
                </label>

                <input
                    type="password"
                    class="form-control"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    minlength="6"
                    required
                    autocomplete="new-password"
                >

            </div>


            <!-- Confirm Password -->
            <div class="mb-4">

                <label
                    for="confirm_password"
                    class="form-label fw-semibold"
                >
                    Confirm Password
                </label>

                <input
                    type="password"
                    class="form-control"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Re-enter your password"
                    minlength="6"
                    required
                    autocomplete="new-password"
                >

            </div>


            <!-- Submit -->
            <button
                type="submit"
                class="btn btn-primary btn-register w-100"
            >
                Create Account
            </button>

        </form>


        <!-- Login -->
        <div class="text-center mt-4">

            <span class="text-muted">
                Already have an account?
            </span>

            <a
                href="{{ url_for('login') }}"
                class="fw-semibold text-decoration-none"
            >
                Login
            </a>

        </div>


        <!-- Back -->
        <div class="text-center mt-3">

            <a
                href="{{ url_for('index') }}"
                class="back-link text-muted"
            >
                ← Back to Home
            </a>

        </div>

    </div>

</div>


<!-- Bootstrap JS -->
<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
